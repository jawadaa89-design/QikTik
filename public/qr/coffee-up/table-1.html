<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Table 1 — Coffee Up</title>
    <style>
      @page { size: A6; margin: 12mm; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, "Times New Roman", serif;
        background: #0c100e;
        color: #f5f5f0;
      }
      .card {
        width: min(360px, 92vw);
        text-align: center;
        padding: 28px 24px 32px;
        border: 1px solid color-mix(in srgb, #f97316 35%, transparent);
        background: linear-gradient(180deg, #141a17, #0c100e);
      }
      img.logo {
        width: 88px;
        height: 88px;
        border-radius: 999px;
        object-fit: cover;
        border: 1px solid color-mix(in srgb, #f97316 45%, transparent);
        background: #f6f3ee;
      }
      h1 { margin: 14px 0 4px; font-size: 1.35rem; font-weight: 600; }
      .label {
        margin: 0 0 18px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 0.72rem;
        color: #f97316;
      }
      img.qr { width: 220px; height: 220px; background: #fff; padding: 10px; }
      .hint { margin: 16px 0 0; font-size: 0.85rem; color: rgba(245, 245, 240, 0.65); }
      .url {
        margin-top: 10px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.62rem;
        word-break: break-all;
        color: rgba(245, 245, 240, 0.4);
      }
      @media print {
        body { background: #fff; color: #111; }
        .card { border-color: #ccc; background: #fff; }
        .label { color: #8a7040; }
        .hint, .url { color: #555; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="https://wvbofh1t280nyujl.public.blob.vercel-storage.com/venues/cmwvwrgi00000ju08u4ornr2p/logo-1795598125827.jpg" alt="Coffee Up" />
      <h1>Coffee Up</h1>
      <p class="label">Table 1</p>
      <img class="qr" src="table-1.png" alt="QR code" />
      <p class="hint">Scan to open the menu at this table</p>
      <p class="url">https://app.qiktik.tech/r/coffee-up/ar/t/t_u5ty31h377x3</p>
    </div>
  </body>
</html>
