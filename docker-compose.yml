# Local PostgreSQL for QikTik (SaaS / multi-venue prep)
# Usage:
#   docker compose up -d
#   npx prisma db push
#   npm run db:seed
#
# Then set in .env:
#   DATABASE_URL="postgresql://qiktik:qiktik@localhost:5432/qiktik?schema=public"

services:
  postgres:
    image: postgres:16-alpine
    container_name: qiktik-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: qiktik
      POSTGRES_PASSWORD: qiktik
      POSTGRES_DB: qiktik
    volumes:
      - qiktik_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiktik -d qiktik"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qiktik_pg_data:
